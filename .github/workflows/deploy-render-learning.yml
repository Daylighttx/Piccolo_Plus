name: Deploy rendering tutorial to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/render-learning/**'
      - '.github/workflows/deploy-render-learning.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/render-learning/package-lock.json
      - name: Install dependencies
        working-directory: docs/render-learning
        run: npm ci
      - name: Build tutorial
        working-directory: docs/render-learning
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/render-learning/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
